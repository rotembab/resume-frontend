<svg xmlns="http://www.w3.org/2000/svg" width="856" height="258" viewBox="0 0 856 258">
  <title>ESP32 request path</title>
  <desc>ESP32 sends input to the Python bridge, which runs the Claude Agent SDK. A compact view of the prototype architecture.</desc>
  <rect width="856" height="258" fill="#0e191c"/>
  <g fill="#111e22" stroke-width="3">
    <rect x="28" y="50" width="216" height="158" rx="14" stroke="#48b6a4"/>
    <rect x="320" y="50" width="216" height="158" rx="14" stroke="#79bce0"/>
    <rect x="612" y="50" width="216" height="158" rx="14" stroke="#e6b850"/>
  </g>
  <g fill="#e7edef" font-family="Arial,sans-serif" font-size="36" text-anchor="middle">
    <text x="136" y="142">ESP32</text>
    <text x="428" y="121">Python</text><text x="428" y="164">bridge</text>
    <text x="720" y="121">Claude</text><text x="720" y="164">Agent SDK</text>
  </g>
  <g fill="none" stroke="#aab8bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M263 129h35m-11-11 11 11-11 11"/>
    <path d="M555 129h35m-11-11 11 11-11 11"/>
  </g>
</svg>
